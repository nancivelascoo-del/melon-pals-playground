<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#8fd3ff;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column}
#top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 6px max(8px,env(safe-area-inset-left));
  background:linear-gradient(#ffffffd9,#ffffffb3);box-shadow:0 2px 8px #0002;z-index:2}
.grp{display:flex;gap:6px;align-items:center}
#stage{flex:1;position:relative;min-height:0;overflow:hidden}
#c{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#bar{flex:none;display:flex;align-items:center;min-width:0;min-height:0;z-index:2;background:linear-gradient(#ffffffb3,#ffffffd9);box-shadow:0 -2px 8px #0002;
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#bottom{flex:1;min-width:0;min-height:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x;padding:6px 6px;scrollbar-width:none}
.sarr{flex:none;width:46px;height:66px;border:none;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;transition:opacity .2s}
.sarr svg{width:40px;height:40px;pointer-events:none}
.sarr:active{transform:scale(.86)}
.sarr.dim{opacity:.2;pointer-events:none}
#bar.fits .sarr{display:none}
#bottom::-webkit-scrollbar{display:none}
#spawns{display:flex;gap:8px;width:max-content;margin:0 auto}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;touch-action:manipulation;cursor:pointer;outline:none}
.btn{--s:clamp(40px,10vw,66px);width:var(--s);height:var(--s);border-radius:16px;border:3px solid #fff;background:#fff;
  box-shadow:0 3px 0 #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;gap:1px;
  transition:transform .08s}
.btn:active{transform:scale(.92)}
.btn svg{width:64%;height:64%;pointer-events:none}
.btn span{font-size:clamp(8px,1.6vw,11px);font-weight:800;color:#3a4a5c;line-height:1;pointer-events:none;white-space:nowrap}
.btn.on{background:#ffe66d;border-color:#ffb703}
.spawn{--s:clamp(58px,13vw,78px);width:var(--s);height:var(--s);border-radius:18px;background:#f5fbff;border:3px solid #cfe8ff;
  box-shadow:0 3px 0 #0002;padding:0;display:flex;align-items:center;justify-content:center}
.spawn canvas{width:86%;height:86%;pointer-events:none}
.spawn:active{transform:scale(.9)}
#modal{position:fixed;left:0;top:0;right:0;bottom:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:9}
#modal[hidden]{display:none}
.card{background:#fff;border-radius:28px;padding:22px 26px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:0 10px 30px #0004}
.card .pic{width:96px;height:96px}
.row{display:flex;gap:28px}
.bigb{width:96px;height:96px;border-radius:50%;border:none;box-shadow:0 5px 0 #0003;display:flex;align-items:center;justify-content:center}
.bigb svg{width:60%;height:60%}
.bigb.yes{background:#51cf66}.bigb.no{background:#ff6b6b}
@media (orientation: landscape) and (max-height: 540px){
  #app{flex-direction:row}
  #top{flex-direction:column;justify-content:center;gap:10px;box-shadow:2px 0 8px #0002;
    padding:max(6px,env(safe-area-inset-top)) 6px max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
  .grp{display:grid;grid-template-columns:auto auto;gap:5px}
  .btn{--s:clamp(36px,10.5vh,54px);border-radius:12px}
  #bar{flex-direction:column;box-shadow:-2px 0 8px #0002;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) 0}
  #bottom{overflow-x:hidden;overflow-y:auto;touch-action:pan-y;display:flex;padding:4px 6px}
  .sarr{width:100%;height:40px}
  .sarr svg{width:34px;height:34px;transform:rotate(90deg)}
  #spawns{flex-direction:column;width:auto;margin:auto 0}
  .spawn{--s:clamp(46px,15vh,64px)}
}
.btn{position:relative}
.btn .dot{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;border:2px solid #fff;display:none}
.btn.net-on .dot{display:block;background:#2f9e44}
.btn.net-wait .dot{display:block;background:#f59f00;animation:pulse 1s infinite}
.btn.off{opacity:.35}
@keyframes pulse{50%{transform:scale(1.35)}}
@media (max-width: 440px){ .btn{--s:clamp(34px,9.2vw,40px)} .grp,#top{gap:4px} #top{padding-left:max(6px,env(safe-area-inset-left));padding-right:max(6px,env(safe-area-inset-right))} }
.ovl{position:fixed;left:0;top:0;right:0;bottom:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:9}
.ovl[hidden]{display:none}
#ask{z-index:11}
.ncard{position:relative;background:#fff;border-radius:28px;padding:24px 20px 20px;max-width:min(560px,94vw);max-height:92vh;overflow:auto;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 10px 30px #0004;touch-action:pan-y}
.nt{font-size:clamp(18px,4.5vw,26px);font-weight:800;color:#2b2d42;text-align:center}
.xbtn{position:absolute;top:8px;right:8px;width:46px;height:46px;border-radius:50%;border:none;background:#f1f3f5;display:flex;align-items:center;justify-content:center;padding:0}
.xbtn svg{width:55%;height:55%}
.pals{width:min(150px,36vw)}
.opts{display:flex;gap:18px}
.opt{width:clamp(110px,30vw,150px);height:clamp(110px,30vw,150px);border-radius:26px;border:4px solid #d0ebff;background:#f5fbff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;font-size:20px;font-weight:800;color:#2b2d42;box-shadow:0 4px 0 #0002;padding:0}
.opt svg{width:58%;height:58%}
.opt:active,.pk:active,.nbtn:active{transform:scale(.92)}
.tiles{display:flex;gap:clamp(4px,1.5vw,10px)}
.tile{width:clamp(48px,14vw,76px);height:clamp(48px,14vw,76px);border-radius:16px;background:#fff9db;border:3px solid #ffd43b;display:flex;align-items:center;
  justify-content:center;font-size:clamp(30px,9vw,50px);line-height:1;box-sizing:border-box}
.tile.empty{background:#f1f3f5;border:3px dashed #ced4da}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(6px,2vw,12px)}
.pk{width:clamp(56px,17vw,84px);height:clamp(56px,17vw,84px);border-radius:18px;border:3px solid #e9ecef;background:#fff;font-size:clamp(32px,10vw,50px);
  line-height:1;box-shadow:0 3px 0 #0002;padding:0}
.nrow{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.nbtn{min-height:56px;padding:0 22px 0 14px;border-radius:28px;border:none;font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 #0002}
.nbtn svg{width:34px;height:34px}
.nbtn.red{background:#ffe3e3;color:#c92a2a}.nbtn.blue{background:#e7f5ff;color:#1864ab}.nbtn.gray{background:#f1f3f5;color:#495057}
.st{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;color:#495057;text-align:center}
.st svg{width:34px;height:34px;flex:none}
.spin{width:28px;height:28px;border-radius:50%;border:4px solid #d0ebff;border-top-color:#339af0;animation:sp .9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#toast{position:absolute;top:10px;left:50%;transform:translate(-50%,-40px);opacity:0;transition:transform .25s,opacity .25s;background:#fff;border-radius:22px;
  padding:8px 16px;font-weight:800;font-size:18px;color:#2b2d42;box-shadow:0 4px 12px #0003;display:flex;align-items:center;gap:8px;pointer-events:none;z-index:3;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast svg{width:40px;height:26px}
</style>
</head>

<script>
(function(){
'use strict';
var TAU = Math.PI * 2;
var canvas = document.getElementById('c');
var mainCtx = canvas.getContext('2d');
var ctx = mainCtx;
var stage = document.getElementById('stage');

/* ---------------- world state ---------------- */
var W = 1000, H = 700, scale = 1, dpr = 1, cssW = 1, cssH = 1;
var FLOOR_H = 42;
var GRAV = 1800;
var BUOY = 5.5;          // balloon lift (in "mass units" of gravity)
var MAX_BODIES = 60;
var gravMode = 0;        // 0 normal, 1 zero-g, 2 upside-down
var slow = false, muted = false, dance = false, tool = 'grab';
var bodies = [], links = [], particles = [];
var nextId = 1, uidCounter = 1, simTime = 0, subStamp = 0, frameNo = 0;
var bgCache = null;
var role = 'solo', guestMirror = false, viewOX = 0, viewOY = 0, netLive = false, netEvents = [];   // multiplayer state
function floorY(){ return H - FLOOR_H; }
function upDir(){ return gravMode === 0 ? -1 : gravMode === 2 ? 1 : 0; }

var SHIRTS = ['#ff6b6b','#4dabf7','#ffd43b','#b197fc','#ff922b','#38d9a9','#f783ac'];
var PANTS = ['#364fc7','#5c3d2e','#495057','#087f5b','#862e9c','#1864ab'];
var BALLOONS = ['#ff4d6d','#ffbe0b','#3a86ff','#8338ec','#06d6a0','#fb5607','#ff70a6'];
var BALLS = [['#ff6b6b','#ffffff','#4dabf7','#ffffff','#ffd43b','#ffffff'],['#ff922b','#ffd43b','#ff922b','#ffd43b','#ff922b','#ffd43b'],['#f783ac','#b197fc','#f783ac','#b197fc','#f783ac','#b197fc']];
var CARS = ['#ff4757','#1e90ff','#ffa502','#2ed573','#a55eea'];
var BLOCKS = ['#ff6b6b','#4dabf7','#ffd43b'];
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function clamp(v,a,b){ return v < a ? a : v > b ? b : v; }

/* ---------------- bodies ---------------- */
function P(x, y, m, r){
  return {x:x, y:y, px:x, py:y, vx:0, vy:0, tx:x, ty:y, m:m, w:m > 0 ? 1/m : 0, r:r || 0,
          pin:false, drag:false, body:null, idx:0, uid:uidCounter++, ct:-9, fric:null};
}
function iw(p){ return (p.pin || p.drag) ? 0 : p.w; }
function addPt(b, x, y, m, r){ var p = P(x, y, m, r); p.body = b; p.idx = b.pts.length; b.pts.push(p); return p; }
function con(b, i, j, k, t, len){
  var a = b.pts[i], c = b.pts[j];
  b.cons.push({a:a, b:c, len: len != null ? len : Math.hypot(c.x - a.x, c.y - a.y), k: k == null ? 1 : k, t: t || 0});
}
function capsule(b, i, j, r){ b.caps.push({a:b.pts[i], b:b.pts[j], r:r, body:b, stamp:0}); }
var LAYER = {tramp:0, fan:0, slide:0, swing:0, castle:0, pool:0, plank:1, box:1, ball:1, melon:1, car:1, rocket:1, dino:1, puppy:1, person:2, balloon:3};

function make(type, x, y, o){
  o = o || {};
  var b = {id:nextId++, type:type, pts:[], cons:[], caps:[], bounce:0.2, fric:0.5, opts:o, stat:false,
           data:{ang:0, wa:0, dizzy:0, hitCool:0, tickle:0, blink:2 + Math.random()*3, ph:Math.random()*TAU, stuck:0, happy:0}};
  var i;
  switch(type){
  case 'person':
    o.shirt = o.shirt || pick(SHIRTS); o.pants = o.pants || pick(PANTS);
    addPt(b,x,y-32,1.6,20); addPt(b,x,y,1.2,9); addPt(b,x,y+48,1.2,10);
    addPt(b,x-14,y+22,0.6,6); addPt(b,x-20,y+46,0.5,7); addPt(b,x+14,y+22,0.6,6); addPt(b,x+20,y+46,0.5,7);
    addPt(b,x-8,y+84,0.7,7); addPt(b,x-10,y+118,0.6,8); addPt(b,x+8,y+84,0.7,7); addPt(b,x+10,y+118,0.6,8);
    [[0,1],[1,2],[1,3],[3,4],[1,5],[5,6],[2,7],[7,8],[2,9],[9,10]].forEach(function(e){ con(b,e[0],e[1]); });
    con(b,0,2,1,1,68); con(b,4,1,1,1,24); con(b,6,1,1,1,24); con(b,8,2,1,1,36); con(b,10,2,1,1,36);
    con(b,7,9,1,1,12); con(b,8,10,1,1,10); con(b,0,3,1,1,24); con(b,0,5,1,1,24); con(b,0,7,0.5,1,90); con(b,0,9,0.5,1,90);
    capsule(b,1,2,12); capsule(b,1,3,5); capsule(b,3,4,5); capsule(b,1,5,5); capsule(b,5,6,5);
    capsule(b,2,7,6); capsule(b,7,8,6); capsule(b,2,9,6); capsule(b,9,10,6);

    if (!num(m.t) || !Array.isArray(m.b)) return;
    var off = now - m.t; offEst = offEst == null ? off : (off < offEst ? off : offEst + (off - offEst)*0.02);
    if (num(m.W) && num(m.H) && (m.W !== hostW || m.H !== hostH)) { hostW = clamp(m.W, 200, 5000); hostH = clamp(m.H, 200, 5000); applyGuestView(); }
    (m.n || []).forEach(function(r){
      var t = TYPES[r[1]]; if (!t || mirror.has(r[0])) return;
      var o = r[2] && typeof r[2] === 'object' ? r[2] : {};
      var b = make(t, 0, 0, o); b.id = r[0]; mirror.set(r[0], b);
    });
    var map = new Map(); m.b.forEach(function(r){ if (Array.isArray(r)) map.set(r[0], r); });
    snaps.push({t:m.t, map:map}); if (snaps.length > 10) snaps.shift();
    var nb = [];
    map.forEach(function(r, id){
      var b = mirror.get(id); if (!b) return;
      nb.push(b);
      var f = r[1] | 0, d = b.data;
      d.dizzy = f & 1 ? 1 : 0; d.happy = f & 2 ? 1 : 0; d.tickle = 0;
      b.pts.forEach(function(p, j){ p.pin = !!((r[2] >> j) & 1); p.drag = false; });
      b.pts[0].drag = !!(f & 4);
      if (b.type === 'car' || b.type === 'fan' || b.type === 'dino' || b.type === 'puppy') b.opts.dir = f & 8 ? -1 : 1;
      d.fx = f & 16 ? 1 : 0; d.fx2 = f & 32 ? 1 : 0; if (b.type === 'castle' && d.fx) d.wob = Math.max(d.wob || 0, 0.7);
      if (!b.placed) { b.placed = true; placeFrom(b, r, null, 0); }
    });
    bodies = nb;
    mirror.forEach(function(b, id){ if (!map.has(id)) mirror.delete(id); });
    links = [];
    (m.l || []).forEach(function(k){ var A = mirror.get(k[0]), B = mirror.get(k[2]); if (A && B && A.pts[k[1]] && B.pts[k[3]]) links.push({a:A.pts[k[1]], b:B.pts[k[3]], len:0, k:1, t:0}); });
    hands = Array.isArray(m.h) ? m.h.slice(0, 12) : [];
    var g = clamp(m.g | 0, 0, 2);
    if (g !== gravMode || !!m.sl !== slow || !!m.d !== dance) { gravMode = g; slow = !!m.sl; dance = !!m.d; refreshUI(); updateMusic(); }
    (m.e || []).slice(0, 40).forEach(function(e){
      if (!Array.isArray(e)) return;
      if (e[0] === 'b' && BURSTS.indexOf(e[1]) >= 0 && num(e[2]) && num(e[3])) burst(e[2], e[3], e[1], clamp(e[4] | 0, 1, 20));
      else if (e[0] === 's' && SOUNDS.indexOf(e[1]) >= 0) sfx(e[1], e[2]);
    });
  }
  function placeFrom(b, ra, rb, a){
    var n = b.pts.length; if (ra.length < 4 + n*2) return;
    for (var j = 0; j < n; j++) {
      var x = ra[4 + 2*j]/2, y = ra[5 + 2*j]/2;
      if (rb && rb.length === ra.length) { x += (rb[4 + 2*j]/2 - x)*a; y += (rb[5 + 2*j]/2 - y)*a; }
      var p = b.pts[j]; p.x = p.px = p.tx = x; p.y = p.py = p.ty = y;
    }
    var an = ra[3]/100;
    if (rb) { var dd = rb[3]/100 - an; dd = Math.atan2(Math.sin(dd), Math.cos(dd)); an += dd*a; }
    if (b.type === 'car') b.data.wa = an; else if (b.type !== 'fan') b.data.ang = an;
  }
  function interpolate(now){
    if (!snaps.length || offEst == null) return;
    var rt = now - offEst - 110, A = null, B = null, i;
    for (i = snaps.length - 1; i >= 0; i--) if (snaps[i].t <= rt) { A = snaps[i]; B = snaps[i + 1] || null; break; }
    if (!A) { A = snaps[0]; B = null; }
    var latest = snaps[snaps.length - 1], a = B ? clamp((rt - A.t)/Math.max(1, B.t - A.t), 0, 1) : 0;
    for (i = 0; i < bodies.length; i++) {
      var b = bodies[i], ra = A.map.get(b.id), rb = B ? B.map.get(b.id) : null;
      if (!ra) { ra = rb || latest.map.get(b.id); rb = null; }
      if (ra) placeFrom(b, ra, rb, a);
    }
  }
  function guestFrame(now, dt){
    gptrs.forEach(function(g, id){ if (g.dirty && now - g.ls >= 33) { g.ls = now; g.dirty = false; send({k:'pm', i:id | 0, x:r1(g.x), y:r1(g.y)}); } });
    interpolate(now);
    var sdt = dt*(slow ? 0.25 : 1); simTime += sdt;
    bodies.forEach(function(b){ var d = b.data; if (b.type === 'person') { d.blink -= dt; if (d.blink < 0) d.blink = 2.5 + Math.random()*3.5; } else if (b.type === 'fan') d.ang += sdt*22*b.opts.dir; cosmetic(b, sdt); });
    updateParticles(sdt);
  }
  function drawHands(){
    hands.forEach(function(h){
      if (!Array.isArray(h)) return;
      var col = HANDC[h[0]] || '#fff', x = h[1]/2, y = h[2]/2;
      if (h[3] != null) { ctx.setLineDash([6, 6]); line({x:x, y:y}, {x:h[3]/2, y:h[4]/2}, 2.5, col); ctx.setLineDash([]); }
      if (h[0] !== 1) circle(x, y, 10, null, col, 3);
    });
    gptrs.forEach(function(g){ circle(g.x, g.y, 10, null, HANDC[1], 3); });
  }
  function guestDown(id, x, y, mouse){ gptrs.set(id, {x:x, y:y, ls:performance.now(), dirty:false}); send({k:'pd', i:id | 0, x:r1(x), y:r1(y), tl:tool, s:Math.round((mouse ? 14 : 30)/scale)}); }
  function guestMove(id, x, y){
    var g = gptrs.get(id); if (!g) return; g.x = x; g.y = y;
    var now = performance.now(); if (now - g.ls >= 33) { g.ls = now; g.dirty = false; send({k:'pm', i:id | 0, x:r1(x), y:r1(y)}); } else g.dirty = true;
  }
  function guestUp(id){ var g = gptrs.get(id); if (!g) return; gptrs.delete(id); send({k:'pm', i:id | 0, x:r1(g.x), y:r1(g.y)}); send({k:'pu', i:id | 0}); }
  function applyGuestView(){
    if (hostW && hostH) { W = hostW; H = hostH; scale = Math.min(cssW/W, cssH/H); viewOX = (cssW - W*scale)/2; viewOY = (cssH - H*scale)/2; }
    buildBG();
  }
  function dropped(){
    if (leaving || role !== 'guest') return;
    var c = conn; conn = null; try { c && c.close(); } catch(_) {}
    toLocal(); state = 'reconnecting'; tries = 0; render(); toast(I.pals + 'Reconnecting…'); retryLater(true);
  }
  function toLocal(){   // keep playing on a local copy while we try to reconnect (never saved over this iPad's own world)
    guestMirror = false; var maxId = 0;
    bodies.forEach(function(b){ maxId = Math.max(maxId, b.id); b.pts.forEach(function(p){ p.px = p.tx = p.x; p.py = p.ty = p.y; p.vx = p.vy = 0; p.drag = false; }); b.data.happy = 0; });
    nextId = Math.max(nextId, maxId + 1); gptrs.clear(); hands = []; pointers.clear(); refreshUI();
  }
  function retryLater(first){
    if (role !== 'guest' || leaving || conn || state === 'lost' || retryPending) return;
    if (tries >= 10) { state = 'lost'; render(); toast(I.pals + 'Lost connection'); return; }
    tries++; retryPending = true;
    setT('retry', function(){ retryPending = false; if (role === 'guest' && !conn && !leaving && state === 'reconnecting') guestConnect(); }, first ? 800 : 3000);
  }
  function ended(){ toast(I.pals + 'The game ended'); leave(); }
  function restoreOwn(){
    guestMirror = false; bodies = []; links = []; mirror.clear(); particles.length = 0; pointers.clear(); gptrs.clear(); hands = []; snaps = [];
    dance = false; updateMusic(); hostW = hostH = 0; viewOX = viewOY = 0;
    resize(); if (!load()) starterScene(); refreshUI();
  }

  /* ----- both ----- */
  function leave(){
    leaving = true; clearT(); ask.hidden = true;
    if (conn && conn.open) { try { conn.send({k:'bye'}); } catch(_) {} }
    if (pending) { try { pending.close(); } catch(_) {} }
    var wasGuest = role === 'guest';
    if (role === 'host') dropRemote();
    stopPeer();
    role = 'solo'; state = 'idle'; view = 'menu'; code = null; netEvents.length = 0;
    if (wasGuest) restoreOwn();
    render(); refreshUI();
  }
  setInterval(function(){
    var now = performance.now();
    if (role === 'host' && conn && now - lastRecv > 6000) hostLost();
    if (role === 'guest' && conn) { send({k:'hb'}); if (now - lastRecv > 4500) dropped(); }
  }, 1000);
  window.addEventListener('pagehide', function(){ if (conn && conn.open) { try { conn.send({k:'bye'}); } catch(_) {} } });

  return {send:send, hostFrame:hostFrame, guestFrame:guestFrame, guestDown:guestDown, guestMove:guestMove, guestUp:guestUp,
    drawHands:drawHands, applyGuestView:applyGuestView, leave:leave,
    _testDrop:function(){ var c = conn; if (c) { try { c.close(); } catch(_) {} } },   // used by automated tests only
    debug:function(){ return {role:role, state:state, view:view, err:err, code:code && code.slice(), id:code ? idFor(code) : null, pics:code ? code.map(function(i){ return PICS[i]; }).join('') : '',
      asking:!ask.hidden, conn:!!(conn && conn.open), panel:!panel.hidden, tries:tries}; }};
})();

// offline support: cache the game on this device (only works when served over https/localhost)
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js', {scope: './'}).catch(function(){});
  });
}

// small read-only hook used by automated tests
window.__sb = {
  bodies: function(){ return bodies; }, links: function(){ return links; },
  state: function(){ return {gravMode:gravMode, slow:slow, muted:muted, dance:dance, tool:tool, W:W, H:H, scale:scale, floor:floorY(), n:bodies.length, audio: AC ? AC.state : 'none', role:role, mirror:guestMirror}; },
  toClient: function(x, y){ var r = canvas.getBoundingClientRect(); return {x:r.left + viewOX + x*scale, y:r.top + viewOY + y*scale}; },
  net: function(){ return net.debug(); }, netDrop: function(){ net._testDrop(); },
  make: function(t, x, y, o){ var b = make(t, x, y, o || {}); bodies.push(b); return b; },
  link: function(a, b){ links.push({a:a, b:b, len:0, k:1, t:0}); }, save: save,
  clear: function(){ bodies = []; links = []; particles.length = 0; }, tap: function(b){ tapAction(b); }, spawn: function(t){ return spawn(t); },
  particles: function(){ return particles; }, upright: function(b){ var P = b.pts, f = b.type === 'dino' ? 3 : 2; return (P[f].y + P[f+1].y)/2 - P[0].y; }
};
})();
